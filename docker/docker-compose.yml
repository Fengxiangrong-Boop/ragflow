include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:
  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
      - --workers=${TASK_EXECUTOR_NUM:-1}
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
    volumes:
      - ../common/constants.py:/ragflow/common/constants.py
      - ../common/settings.py:/ragflow/common/settings.py
      - ../rag/utils/local_fs_conn.py:/ragflow/rag/utils/local_fs_conn.py
      - ${LOCAL_FS_HOST_PATH:-/data/xfeng/ragflow-storage}:${LOCAL_FS_PATH:-/ragflow/storage}
      - ../api/db/services/file_service.py:/ragflow/api/db/services/file_service.py
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    environment:
      - STORAGE_IMPL=${STORAGE_IMPL:-MINIO}
      - LOCAL_FS_PATH=${LOCAL_FS_PATH:-/ragflow/storage}
    networks:
      - ragflow
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ragflow-gpu:
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - gpu
    image: ${RAGFLOW_IMAGE}
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
      - --workers=${TASK_EXECUTOR_NUM:-1}
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
    volumes:
      - ../common/constants.py:/ragflow/common/constants.py
      - ../common/settings.py:/ragflow/common/settings.py
      - ../rag/utils/local_fs_conn.py:/ragflow/rag/utils/local_fs_conn.py
      - ./ragflow-venv:/ragflow/.venv
      - ./pip-cache:/root/.cache/uv
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
      - ${LOCAL_FS_HOST_PATH:-/data/xfeng/ragflow-storage}:${LOCAL_FS_PATH:-/ragflow/storage}
    env_file: .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=4
      - STORAGE_IMPL=${STORAGE_IMPL:-MINIO}
      - LOCAL_FS_PATH=${LOCAL_FS_PATH:-/ragflow/storage}
      - LD_LIBRARY_PATH=/ragflow/.venv/lib/python3.12/site-packages/nvidia/cublas/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/cudnn/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/curand/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/cufft/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/cusolver/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/cusparse/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/cuda_nvrtc/lib:/ragflow/.venv/lib/python3.12/site-packages/nvidia/nvjitlink/lib
    networks:
      - ragflow
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4"]
              capabilities: [gpu]


